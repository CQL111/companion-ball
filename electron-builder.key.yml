# electron-builder.key.yml
# 内置 Key 的构建配置：继承主配置，并把 build/bundled-ai.json 复制到安装包的 resources/
# appId 必须与 src/main/index.ts 里的 app.setAppUserModelId('com.companion.ball') 保持一致
appId: com.companion.ball
productName: companion-ball
# 显式命名，避免和公开版资产同名互相覆盖
artifactName: companion-ball.Setup.${version}.${ext}
directories:
  output: out-release-key
  buildResources: resources
files:
  - out/**/*
  - "!**/src/**"
  - "!**/tests/**"
  - "!**/docs/**"
  - "!**/scripts/**"
  - "!**/resources/**"
  - "!**/electron.vite.config.ts"
  - "!**/tsconfig*.json"
  - "!**/vitest.config.ts"
  - "!**/product-intro.html"
  - "!**/CHANGELOG.md"
  - "!**/AGENTS.md"
  - "!**/CLAUDE.md"
  - "!**/.env"
  - "!**/.env.*"
  - "!**/*.map"
  - "!**/*.md"
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 桌面陪伴
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: bundled-ai.json
    to: bundled-ai.json
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/icon-1024.png
  category: public.app-category.entertainment
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: 桌面陪伴 ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: CQL111
  repo: companion-ball
  releaseType: release
