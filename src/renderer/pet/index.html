<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面陪伴</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/ball.css">
</head>
<body>
  <div id="ball" class="ball" data-loco="idle" data-mood="neutral">
    <div class="pet-glow" aria-hidden="true"></div>
    <div id="ball-inner" class="ball-inner" data-mood="smile" data-persona="cat" aria-hidden="true">
      <!-- 猫：有头、有腿、有爪，才能真的「走」和「爬」 -->
      <svg class="pet-figure persona persona-cat" viewBox="0 0 80 80" aria-hidden="true">
        <g class="pet-all">
          <ellipse class="pet-ground" cx="40" cy="79" rx="21" ry="3"/>

          <!-- 尾巴 -->
          <g class="pet-tail">
            <path class="pet-tail-outer" d="M64 58 C74 56 77 45 71 38 C66 32 59 36 62 42"/>
            <path class="pet-tail-tip" d="M71 38 C66 32 59 36 62 42"/>
          </g>

          <!-- 后腿（先画，压在身体后面） -->
          <g class="pet-leg pet-leg-bl">
            <path class="pet-leg-limb" d="M33 64 L32 78"/>
            <ellipse class="pet-paw" cx="32" cy="78.5" rx="4" ry="2.2"/>
          </g>
          <g class="pet-leg pet-leg-br">
            <path class="pet-leg-limb" d="M48 64 L49 78"/>
            <ellipse class="pet-paw" cx="49" cy="78.5" rx="4" ry="2.2"/>
          </g>

          <!-- 身体 -->
          <path class="pet-torso" d="M40 34 C52 34 61 44 61 55 C61 66 51 70 40 70 C29 70 19 66 19 55 C19 44 28 34 40 34 Z"/>
          <path class="pet-belly" d="M40 53 C45 53 48 57 48 61 C48 65 44 67 40 67 C36 67 32 65 32 61 C32 57 35 53 40 53 Z"/>

          <!-- 前腿 -->
          <g class="pet-leg pet-leg-fl">
            <path class="pet-leg-limb" d="M30 62 L29 78"/>
            <ellipse class="pet-paw" cx="29" cy="78.5" rx="4" ry="2.2"/>
          </g>
          <g class="pet-leg pet-leg-fr">
            <path class="pet-leg-limb" d="M51 62 L52 78"/>
            <ellipse class="pet-paw" cx="52" cy="78.5" rx="4" ry="2.2"/>
          </g>

          <!-- 耳朵 -->
          <g class="pet-ear pet-ear-l">
            <path class="pet-ear-outer" d="M22 30 L18 13 L38 24 Z"/>
            <path class="pet-ear-inner" d="M25 28 L22 18 L34 25 Z"/>
          </g>
          <g class="pet-ear pet-ear-r">
            <path class="pet-ear-outer" d="M58 30 L62 13 L42 24 Z"/>
            <path class="pet-ear-inner" d="M55 28 L58 18 L46 25 Z"/>
          </g>
          <!-- 呆毛 -->
          <path class="pet-ahoge" d="M40 15 C43 10 47 11 45 6"/>

          <!-- 头 -->
          <circle class="pet-head" cx="40" cy="38" r="17"/>
          <path class="pet-muzzle" d="M40 46 C44 46 46 48 46 50 C46 53 43 55 40 55 C37 55 34 53 34 50 C34 48 36 46 40 46 Z"/>

          <g class="pet-face">
            <g class="pet-eye pet-eye-open">
              <ellipse cx="32.5" cy="38" rx="3.6" ry="4.2"/>
              <circle class="pet-pupil" cx="33.4" cy="37.6" r="1.7"/>
            </g>
            <g class="pet-eye pet-eye-open" data-x="47.5">
              <ellipse cx="47.5" cy="38" rx="3.6" ry="4.2"/>
              <circle class="pet-pupil" cx="46.6" cy="37.6" r="1.7"/>
            </g>
            <path class="pet-eye pet-eye-happy" d="M29 38.5 Q32.5 34.5 36 38.5"/>
            <path class="pet-eye pet-eye-happy" d="M44 38.5 Q47.5 34.5 51 38.5"/>
            <path class="pet-eye pet-eye-sad" d="M29 36.5 Q32.5 40.5 36 36.5"/>
            <path class="pet-eye pet-eye-sad" d="M44 36.5 Q47.5 40.5 51 36.5"/>
            <path class="pet-nose" d="M38.6 45.5 L41.4 45.5 L40 47.4 Z"/>
            <path class="pet-mouth" d="M35.5 49.5 Q37.6 51.5 40 49.5 Q42.4 51.5 44.5 49.5"/>
            <ellipse class="pet-blush" cx="27" cy="45" rx="3.6" ry="2"/>
            <ellipse class="pet-blush" cx="53" cy="45" rx="3.6" ry="2"/>
          </g>

          <!-- 胡须 -->
          <g class="pet-whiskers">
            <path d="M30 46 L21 44"/>
            <path d="M30 48.5 L21 49"/>
            <path d="M50 46 L59 44"/>
            <path d="M50 48.5 L59 49"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="ball-halo" aria-hidden="true"></div>
    <div class="pet-bubble" id="pet-bubble" role="status" aria-live="polite"></div>
    <nav class="pet-menu" id="pet-menu" aria-label="角色菜单">
      <button class="menu-item" data-action="chat" title="和团子聊聊天">
        <span class="menu-icon">💬</span>
        <span class="menu-text"><b>聊聊天</b><small>它会记得你们说过的话</small></span>
      </button>
      <button class="menu-item" data-action="settings" title="设置">
        <span class="menu-icon">⚙️</span>
        <span class="menu-text"><b>设置</b><small>模型 · 动画 · 开机自启</small></span>
      </button>
    </nav>
  </div>
  <script type="module" src="./pet.ts"></script>
</body>
</html>
