<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>团子猫 — 住你桌面上的小家伙</title>
<meta name="description" content="不是助手，是住你桌面上的一个小家伙。它记得你说过的话，也记得你不在的时候。" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="top">
  <a class="mark" href="/">团子猫</a>
  <nav>
    <a href="/gallery">看海</a>
    <a href="/news">海上的消息</a>
    <a href="/download">下载</a>
  </nav>
</header>

<main class="wrap">
  <span class="kicker">桌面陪伴</span>
  <h1>有人在凌晨两点写下一句话，<br />另一个人在清晨捡到了它。</h1>
  <p class="lead">
    团子猫不是助手，是住你桌面上的一个小家伙。它会记得你随口说的事，
    会在你回来的时候认出你，也会把你写的纸条放进一只瓶子，漂给另一个醒着的人。
  </p>

  <div class="actions">
    <a class="btn primary" href="/download">下载 Windows 版</a>
    <a class="btn" href="/gallery">看看此刻的海 →</a>
  </div>

  <section class="tide">
    <div class="tide-head">
      <h2>此刻 · <span id="pool-name">深夜</span></h2>
      <div><a href="/gallery" style="font-size:13px;color:var(--ink-3)">看更多 →</a></div>
    </div>
    <div class="bottles" id="bottles">
      <p class="status">正在看海…</p>
    </div>
  </section>

  <section class="tide">
    <div class="tide-head">
      <h2>海上的消息</h2>
      <div><a href="/news" style="font-size:13px;color:var(--ink-3)">全部 →</a></div>
    </div>
    <div id="news-mini"><p class="status">正在收信…</p></div>
  </section>

  <footer class="foot">
    <span>只存在你自己的电脑上 · 不会同步、不会分享</span>
    <span><a href="/privacy">隐私</a> · <a href="/terms">协议</a> · <a href="/admin" style="opacity:0.5">值班</a></span>
  </footer>
</main>

<script>
// 首页不弹静读——点这里一律去窗口
function localPool() {
  const h = new Date().getHours()
  if (h >= 22 || h < 5) return ['night', '深夜']
  if (h < 11) return ['morning', '清晨']
  if (h < 18) return ['day', '白天']
  return ['evening', '傍晚']
}
const [pool, label] = localPool()
document.getElementById('pool-name').textContent = label

fetch('/v1/gallery?pool=' + pool)
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error('gallery'))))
  .then((data) => {
    const root = document.getElementById('bottles')
    if (!data.items.length) {
      root.innerHTML = '<p class="empty">海面还很安静。<br>你是最早来的人之一。</p>'
      return
    }
    root.innerHTML = data.items
      .slice(0, 3)
      .map(
        (it) => `
        <a class="bottle" href="/gallery?pool=${pool}">
          <div class="text"></div>
          <div class="by">—— ${escapeHtml(it.alias)}</div>
        </a>`,
      )
      .join('')
    // 正文用 textContent 写入，避免把用户内容当 HTML
    const texts = root.querySelectorAll('.text')
    data.items.slice(0, 3).forEach((it, i) => {
      if (texts[i]) texts[i].textContent = it.body
    })
  })
  .catch(() => {
    document.getElementById('bottles').innerHTML = '<p class="empty">海面不太平静，等会儿再看。</p>'
  })

fetch('/v1/news')
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error('news'))))
  .then((data) => {
    const root = document.getElementById('news-mini')
    if (!data.items.length) {
      root.innerHTML = '<p class="status">还没有消息。</p>'
      return
    }
    const n = data.items[0]
    root.innerHTML = `
      <article class="news-item" style="padding:0;border:none">
        <h3><a href="/news/${encodeURIComponent(n.id)}"></a></h3>
        <p class="summary"></p>
      </article>`
    root.querySelector('h3 a').textContent = n.title
    root.querySelector('.summary').textContent = n.summary
  })
  .catch(() => {
    document.getElementById('news-mini').innerHTML = '<p class="status">没有新消息。</p>'
  })

function escapeHtml(s) {
  const d = document.createElement('div')
  d.textContent = s
  return d.innerHTML
}
</script>
</body>
</html>
