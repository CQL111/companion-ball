# electron-builder.public.yml - 公开版：不内置任何 Key，用户自行配置
# appId 必须与 src/main/index.ts 里的 app.setAppUserModelId('com.companion.ball') 保持一致
appId: com.companion.ball
productName: companion-ball
# monorepo: electron 被 npm workspaces 提升到根 node_modules，
# electron-builder 在包目录下解析不到版本，必须显式指定（与 devDependencies 保持一致）
electronVersion: 30.5.1
# 公开版与内置 Key 版打同一个 Release，资产名必须能区分（产品页下载按钮依赖这个名字）
artifactName: companion-ball-public.Setup.${version}.${ext}
copyright: Copyright © 2026 CQL111
directories:
  output: out-public
  buildResources: resources
files:
  - out/**/*
  - "!**/src/**"
  - "!**/tests/**"
  - "!**/docs/**"
  - "!**/scripts/**"
  - "!**/resources/**"
  - "!**/electron.vite.config.ts"
  - "!**/tsconfig*.json"
  - "!**/vitest.config.ts"
  - "!**/product-intro.html"
  - "!**/CHANGELOG.md"
  - "!**/AGENTS.md"
  - "!**/CLAUDE.md"
  - "!**/.env"
  - "!**/.env.*"
  - "!**/*.map"
  - "!**/*.md"
extraResources:
  - from: resources/tray.png
    to: tray.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon-1024.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 桌面陪伴
  license: ../../docs/legal/user-agreement.md
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/icon-1024.png
  category: public.app-category.entertainment
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: 桌面陪伴 ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish:
  provider: github
  owner: CQL111
  repo: companion-ball
  releaseType: release
