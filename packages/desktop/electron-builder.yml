# electron-builder.yml - 默认 / 本地构建
# appId 必须与 src/main/index.ts 里的 app.setAppUserModelId('com.companion.ball') 保持一致，
# 否则 Windows 通知、任务栏归组和开机自启会指向不同的应用标识。
# 注意：先跑 electron-vite 构建（npm run build），本配置只负责打包应用外框。
appId: com.companion.ball
productName: companion-ball
# monorepo: electron 提升到根 node_modules，electron-builder 解析不到版本，需显式指定
electronVersion: 30.5.1
directories:
  # 产物目录（不用 dist/release，避免被编辑器索引占用导致 EBUSY）
  output: out-release
  buildResources: resources
# 只打包运行所需文件。源码已由 electron-vite 打进 out/，安装包不需要 src/ 与脚本；
# electron-builder 不会自动忽略 .env，这里显式挡掉。
files:
  - out/**/*
  - "!**/src/**"
  - "!**/tests/**"
  - "!**/docs/**"
  - "!**/scripts/**"
  - "!**/resources/**"
  - "!**/electron.vite.config.ts"
  - "!**/tsconfig*.json"
  - "!**/vitest.config.ts"
  - "!**/product-intro.html"
  - "!**/CHANGELOG.md"
  - "!**/AGENTS.md"
  - "!**/CLAUDE.md"
  - "!**/.env"
  - "!**/.env.*"
  - "!**/*.map"
  - "!**/*.md"
extraResources:
  - from: resources/tray.png
    to: tray.png
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 桌面陪伴
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/icon-1024.png
  category: public.app-category.entertainment
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: 桌面陪伴 ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: CQL111
  repo: companion-ball
  releaseType: release
